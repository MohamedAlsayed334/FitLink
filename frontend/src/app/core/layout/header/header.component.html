<header class="fit-header">
  <div class="fit-header__left">
    <button
      type="button"
      class="fit-menu-btn"
      *ngIf="user"
      (click)="onMenuClick()"
      aria-label="Toggle sidebar"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>
    <div class="fit-header__title-group">
      <h1 class="fit-header__title">{{ pageTitle }}</h1>
      <span class="fit-header__subtitle">{{ pageSubtitle }}</span>
    </div>
  </div>

  <div class="fit-header__right">
    <ng-container *ngIf="user; else guestActions">
      <fit-theme-toggle></fit-theme-toggle>
      <fit-notification-bell></fit-notification-bell>
      <fit-account-menu></fit-account-menu>
    </ng-container>
    <ng-template #guestActions>
      <a routerLink="/coaches" routerLinkActive="is-active" class="fit-header__link">Coaches</a>
      <a routerLink="/login" class="fit-btn fit-btn--ghost fit-header__cta">Login</a>
      <a routerLink="/register" class="fit-btn fit-btn--primary fit-header__cta">Register</a>
    </ng-template>
  </div>
</header>
